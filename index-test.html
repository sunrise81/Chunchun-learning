<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>纯纯英语练习 - Day 3</title>
<style>
body{font-family:-apple-system,Microsoft YaHei,sans-serif;max-width:640px;margin:0 auto;padding:16px;background:#f0f2f5}
.header{text-align:center;padding:16px}
.header h1{color:#1a1a2e;font-size:1.6rem}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.nav button{flex:1;min-width:30%;padding:10px;background:#4A90E2;color:#fff;border:none;border-radius:8px;font-size:13px;cursor:pointer}
.nav button.active{background:#2E7D32}
.card{background:#fff;padding:16px;border-radius:10px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.q-stem{font-size:1.05rem;margin-bottom:8px}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:10px;border:2px solid #e0e0e0;border-radius:6px;cursor:pointer}
.opt:hover{background:#e8f4ff}
.opt.selected{background:#e3f0ff;border-color:#4A90E2}
.opt.correct{background:#e8f5e9;border-color:#2E7D32}
.opt.wrong{background:#ffebee;border-color:#d32f2f}
.cloze-input{width:100px;padding:6px;margin:0 4px;border:none;border-bottom:2px solid #4A90E2}
textarea{width:100%;padding:10px;margin:10px 0;border:2px solid #4A90E2;border-radius:6px}
.submit-btn{width:100%;padding:14px;background:#4A90E2;color:#fff;border:none;border-radius:8px;font-size:17px;margin-top:16px;cursor:pointer}
.result-banner{text-align:center;padding:20px;border-radius:10px;margin:12px 0}
.result-banner.good{background:#e8f5e9;color:#2E7D32}
.result-banner.ok{background:#fff3e0;color:#e65100}
.result-banner.bad{background:#ffebee;color:#c62828}
.history-item{background:#fff;padding:14px;border-radius:10px;margin:10px 0;border-left:4px solid #4A90E2}
.empty-state{text-align:center;padding:40px;color:#999}
</style>
</head>
<body>
<div class="header">
<h1>纯纯英语练习 - Day 3</h1>
<p>other/another/the other/others 辨析</p>
</div>
<div class="nav">
<button id="btn-quiz" class="active" onclick="show('quiz')">选择题</button>
<button id="btn-cloze" onclick="show('cloze')">完形填空</button>
<button id="btn-trans" onclick="show('trans')">翻译题</button>
<button id="btn-history" onclick="show('history')">历史记录</button>
</div>
<div id="content"></div>
<script>
var DAY = 3;
var FORM_URL = 'https://script.google.com/macros/s/AKfycbzWtC4mccz2RO85GId5hOGOkN9JfmeAUMfTGm9tbLp3OLMqO7O0aJTHP4J5jCfye5qYJw/exec';

var QUESTIONS = [
  {q:'This is my book. _____ book is on the desk.',a:['Another','Other','The other','Others'],ans:2,exp:'两本书，另一本用The other'},
  {q:'Some students are playing, _____ are watching.',a:['the other','others','another','other'],ans:1,exp:'others=其他的人'},
  {q:'I dont like this pen. Give me _____ one.',a:['the other','others','another','other'],ans:2,exp:'another=再拿一个'},
  {q:'40 students, 20 are boys, _____ are girls.',a:['the other','others','another','other'],ans:0,exp:'the other=剩余全部'},
  {q:'Two apples, one red, _____ is green.',a:['the other','others','another','other'],ans:0,exp:'两者中的另一个'},
  {q:'_____ students study hard.',a:['Other','Others','Another','The other'],ans:0,exp:'Other+复数名词'}
];

var CLOZE = [
  {a:'another',hint:'三者中任意另一个'},
  {a:'another',hint:'泛指再一个'},
  {a:'others',hint:'其余的'}
];

var TRANS = [
  {zh:'另一个人是我的朋友。',hint:'another+单数',ans:'Another person is my friend.'},
  {zh:'其他学生都回家了。',hint:'the other+复数',ans:'The other students have gone home.'},
  {zh:'给我另外一个。',hint:'another one',ans:'Give me another one.'}
];

var quizAnswers={}, quizSubmitted=false;

function show(tab){
  document.querySelectorAll('.nav button').forEach(function(b){b.classList.remove('active')});
  document.getElementById('btn-'+tab).classList.add('active');
  var el=document.getElementById('content');
  if(tab==='quiz')renderQuiz(el);
  else if(tab==='cloze')renderCloze(el);
  else if(tab==='trans')renderTrans(el);
  else if(tab==='history')renderHistory(el);
}

function renderQuiz(el){
  var html='<div class="card" style="background:#e3f2fd;border-left:4px solid #4A90E2"><b>语法规则：</b> another=泛指另一个 other=其他的 the other=两者中另一个 others=其他的</div>';
  for(var i=0;i<QUESTIONS.length;i++){
    var q=QUESTIONS[i];
    html+='<div class="card"><div class="q-stem"><b>Q'+(i+1)+'.</b> '+q.q+'</div><div class="opt-grid">';
    for(var j=0;j<q.a.length;j++){
      var cls='opt';
      if(quizSubmitted){if(j===q.ans)cls+=' correct';else if(quizAnswers[i]===j)cls+=' wrong';}
      else if(quizAnswers[i]===j)cls+=' selected';
      html+='<div class="'+cls+'" onclick="pickQ('+i+','+j+')">'+(65+j)+'. '+q.a[j]+'</div>';
    }
    html+='</div></div>';
  }
  if(!quizSubmitted)html+='<button class="submit-btn" onclick="submitQuiz()">提交</button>';
  el.innerHTML=html;
}

function pickQ(i,j){if(quizSubmitted)return;quizAnswers[i]=j;show('quiz');}

function submitQuiz(){
  var score=0, wrongs=[];
  for(var i=0;i<QUESTIONS.length;i++){
    if(quizAnswers[i]===QUESTIONS[i].ans)score++;else wrongs.push(i+1);
  }
  quizSubmitted=true;
  var pct=score/QUESTIONS.length;
  var cls=pct>=0.8?'good':pct>=0.5?'ok':'bad';
  var banner='<div class="result-banner '+cls+'">得分: '+score+'/'+QUESTIONS.length+'</div>';
  document.getElementById('content').insertAdjacentHTML('afterbegin',banner);
  saveRecord('quiz',score,QUESTIONS.length,wrongs);
  show('quiz');
}

function renderCloze(el){
  var html='<div class="card"><p>完形填空：用适当形式填空</p>';
  var p=['One is broken','I want to buy','Some are Lily'];
  for(var i=0;i<CLOZE.length;i++){
    html+='<div>'+p[i]+' <input class="cloze-input" id="c'+i+'" placeholder="?"> '+CLOZE[i].hint+'</div>';
  }
  html+='<button class="submit-btn" onclick="submitCloze()">提交</button></div>';
  el.innerHTML=html;
}

function submitCloze(){
  var score=0;
  for(var i=0;i<CLOZE.length;i++){
    var v=document.getElementById('c'+i).value.trim().toLowerCase();
    if(v===CLOZE[i].a.toLowerCase())score++;
  }
  var cls=score>=2?'good':'ok';
  document.getElementById('content').insertAdjacentHTML('afterbegin','<div class="result-banner '+cls+'">得分: '+score+'/'+CLOZE.length+'</div>');
  saveRecord('cloze',score,CLOZE.length,[]);
}

function renderTrans(el){
  var html='<div class="card">';
  for(var i=0;i<TRANS.length;i++){
    html+='<div><b>'+(i+1)+'. '+TRANS[i].zh+'</b><p style="color:#888;font-size:.85rem">'+TRANS[i].hint+'</p><textarea id="t'+i+'" rows="2"></textarea></div>';
  }
  html+='<button class="submit-btn" onclick="submitTrans()">提交</button></div>';
  el.innerHTML=html;
}

function submitTrans(){
  saveRecord('translate',0,TRANS.length,[]);
  document.getElementById('content').insertAdjacentHTML('afterbegin','<div class="result-banner ok">已提交</div>');
}

function saveRecord(type,score,total,wrongs){
  var now=new Date();
  var record={type:type,day:DAY,score:score,total:total,date:now.toLocaleDateString(),time:now.getHours()+':'+now.getMinutes(),wrongList:wrongs};
  var h=JSON.parse(localStorage.getItem('chunchunHistory')||'[]');
  h.unshift(record);
  localStorage.setItem('chunchunHistory',JSON.stringify(h.slice(0,50)));
  var body=new URLSearchParams();
  body.append('date',record.date);
  body.append('answers',JSON.stringify(record));
  body.append('score',score+'/'+total);
  fetch(FORM_URL,{method:'POST',mode:'no-cors',body:body}).catch(function(){});
}

function renderHistory(el){
  var h=JSON.parse(localStorage.getItem('chunchunHistory')||'[]');
  if(h.length===0){el.innerHTML='<div class="empty-state">暂无历史记录</div>';return;}
  var html='';
  for(var i=0;i<h.length;i++){
    html+='<div class="history-item"><b>'+h[i].type+'</b> '+h[i].score+'/'+h[i].total+' <span style="color:#888">'+h[i].date+'</span></div>';
  }
  el.innerHTML=html;
}

show('quiz');
</script>
</body>
</html>
