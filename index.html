<!DOCTYPE html>
<html>
<head>
<meta charset="GBK">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>English Practice</title>
<style>
body{font-family:sans-serif;max-width:600px;margin:0 auto;padding:20px;background:#f5f5f5}
h1{text-align:center}
.nav{display:flex;gap:10px;margin-bottom:20px}
.nav button{flex:1;padding:15px;background:#4A90E2;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer}
.nav button.active{background:#2E7D32}
.card{background:white;padding:20px;border-radius:10px;margin:10px 0}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{padding:10px;border:2px solid #ddd;border-radius:5px;cursor:pointer;text-align:left}
.opt:hover{background:#e8f4ff}
.opt.selected{border-color:#4A90E2;background:#e8f4ff}
input,textarea{width:100%;padding:10px;margin:5px 0;border:2px solid #4A90E2;border-radius:5px;box-sizing:border-box}
.submit{width:100%;padding:15px;background:#4A90E2;color:white;border:none;border-radius:8px;font-size:18px;margin-top:15px}
.history-item{background:white;padding:15px;border-radius:10px;margin:10px 0;border-left:4px solid #4A90E2}
.history-item .header{display:flex;justify-content:space-between;margin-bottom:10px}
.history-item .score{font-weight:bold;color:#2E7D32}
.history-item .wrong{color:#d32f2f;margin-top:10px;padding:10px;background:#ffebee;border-radius:5px}
.history-item .wrong-item{margin:5px 0}
.history-item .hint{color:#666;font-size:14px}
</style>
</head>
<body>
<h1>English Practice</h1>
<div class="nav">
<button id="btn-quiz" class="active" onclick="show('quiz')">Quiz</button>
<button id="btn-cloze" onclick="show('cloze')">Cloze</button>
<button id="btn-trans" onclick="show('trans')">Translate</button>
<button id="btn-history" onclick="show('history')">History</button>
</div>
<div id="content"></div>
<script>
var currentDay = new URLSearchParams(window.location.search).get('day') || 'latest';

function getDayData(day) {
    var data = {
        '1': {
            questions: [
{c:'She has _____ friends in the new city.',o:['A. few','B. little','C. a few','D. a little'],a:'A'},
{c:'There is _____ water left in the bottle.',o:['A. few','B. little','C. a few','D. many'],a:'B'},
{c:'I have _____ minutes before my meeting.',o:['A. little','B. few','C. a few','D. a little'],a:'C'},
{c:'Could you lend me _____ money?',o:['A. few','B. a few','C. a little','D. little'],a:'C'},
{c:'Very _____ people know about this secret.',o:['A. little','B. a little','C. a few','D. few'],a:'D'},
{c:'There is very _____ hope of finding them.',o:['A. few','B. a few','C. little','D. a little'],a:'C'},
{c:'He spoke _____ English, so we managed to communicate.',o:['A. few','B. a few','C. little','D. a little'],a:'D'},
{c:'Only _____ students passed the difficult exam.',o:['A. little','B. a little','C. a few','D. few'],a:'C'}
            ],
            cloze: [
{t:'I only need _____ more seconds to finish this.',a:'a few',hint:'countable, positive'},
{t:'She has _____ patience when people are late.',a:'little',hint:'uncountable, negative'},
{t:'Can I have _____ sugar in my tea?',a:'a little',hint:'uncountable, positive'},
{t:'Very _____ cars were parked outside.',a:'few',hint:'countable, negative'},
{t:'We have _____ time left, so let us hurry.',a:'little',hint:'uncountable, negative'},
{t:'I met _____ old friends at the reunion.',a:'a few',hint:'countable, positive'}
            ]
        }
    };
    if (day === 'latest') return null;
    return data[day] || null;
}

var dayData = getDayData(currentDay);
var questions = dayData ? dayData.questions : [
{n:1,c:'No questions loaded. Add ?day=1 to URL.',o:['A.','B.','C.','D.'],a:'A'}
];
var cloze = dayData ? dayData.cloze : [
{t:'No cloze loaded. Add ?day=1 to URL.',a:'',hint:''}
];
var trans = [
{c:'No translation available.',a:''}
];
var answers = {};

function show(page) {
    if(page==='quiz' && dayData && dayData.questions) window.questions = dayData.questions;
    if(page==='cloze' && dayData && dayData.cloze) window.cloze = dayData.cloze;
    document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
    document.getElementById('btn-'+page).classList.add('active');
    var html = '';
    if(page==='quiz'){
    for(var i=0;i<questions.length;i++){
    var q=questions[i];
    html+='<div class="card"><b>Q'+(i+1)+'</b>. '+q.c+'</div>';
    html+='<div class="opt-grid">';
    for(var j=0;j<q.o.length;j++){
    var letter=String.fromCharCode(65+j);
    html+='<div class="opt" onclick="selectQ('+i+',\''+letter+'\')" id="q'+i+letter+'">'+q.o[j]+'</div>';
    }
    html+='</div>';
    }
    html+='<button class="submit" onclick="submitQuiz()">Submit</button>';
    }else if(page==='cloze'){
    for(var i=0;i<cloze.length;i++){
    html+='<div class="card"><b>Blank '+(i+1)+'</b>: '+cloze[i].t+'<br><input id="c'+i+'" placeholder="your answer"></div>';
    }
    html+='<button class="submit" onclick="submitCloze()">Submit</button>';
    }else if(page==='trans'){
    for(var i=0;i<trans.length;i++){
    html+='<div class="card"><b>'+(i+1)+'</b>. '+trans[i].c+'<br><textarea id="t'+i+'" rows="2"></textarea></div>';
    }
    html+='<button class="submit" onclick="submitTrans()">Submit</button>';
    }else if(page==='history'){
    html += renderHistory();
    }
    document.getElementById('content').innerHTML = html;
}

function loadHistory() {
    var data = localStorage.getItem('chunchunHistory');
    return data ? JSON.parse(data) : [];
}

function saveHistory(record) {
    var history = loadHistory();
    history.unshift(record);
    localStorage.setItem('chunchunHistory', JSON.stringify(history));
}

function renderHistory() {
    var history = loadHistory();
    if(history.length === 0) {
        return '<div class="card"><b>History</b><br>No records yet</div>';
    }
    var html = '';
    for(var i=0;i<history.length;i++) {
        var h = history[i];
        html += '<div class="history-item">';
        html += '<div class="header"><span>'+h.type.toUpperCase()+' - '+h.date+' '+h.time+'</span><span class="score">'+h.score+'/'+h.total+'</span></div>';
        if(h.wrongList && h.wrongList.length > 0) {
            html += '<div class="wrong"><b>Wrong Answers:</b>';
            for(var j=0;j<h.wrongList.length;j++) {
                var w = h.wrongList[j];
                html += '<div class="wrong-item">Q'+w.n+': Your answer: '+w.ans+' -> Correct: '+w.correct+'<div class="hint">Hint: '+w.hint+'</div></div>';
            }
            html += '</div>';
        }
        html += '</div>';
    }
    return html;
}

function selectQ(n,letter){
answers['q'+n]=letter;
var card = document.getElementById('q'+n+letter).parentElement;
card.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
event.target.classList.add('selected');
}

function submitQuiz(){
var score=0;
var wrongList = [];
for(var i=0;i<questions.length;i++){
if(answers['q'+i]===questions[i].a){
score+=4;
} else {
wrongList.push({n:i+1,ans:answers['q'+i]||'',correct:questions[i].a,hint:''});
}
}
var now = new Date();
var dateStr = now.getFullYear()+'-'+(now.getMonth()+1)+'-'+now.getDate()+' '+now.getHours()+':'+now.getMinutes();
var ansStr = '';
for(var n in answers){ansStr += n+':'+answers[n]+',';}
var formUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSdFpVVqYzHXucoNf6URb4ZnSy4c7nZYk5FvKI6CNsSjPhWUjA/formResponse';
var form = document.createElement('form');
form.action = formUrl;
form.method = 'POST';
form.target = '_blank';
var f1 = document.createElement('input'); f1.name = 'entry.705164145'; f1.value = dateStr; form.appendChild(f1);
var f2 = document.createElement('input'); f2.name = 'entry.9424799'; f2.value = ansStr; form.appendChild(f2);
var f3 = document.createElement('input'); f3.name = 'entry.1864991047'; f3.value = score+'/'+(questions.length*4); form.appendChild(f3);
document.body.appendChild(form);
form.submit();
document.body.removeChild(form);
saveHistory({type:'quiz',date:now.toLocaleDateString(),time:now.toLocaleTimeString().slice(0,5),score:score,total:questions.length*4,wrongList:wrongList});
alert('Score: '+score+'/'+(questions.length*4));
show('history');
}

function submitCloze(){
var score=0;
var wrongList = [];
for(var i=0;i<cloze.length;i++){
var ans=document.getElementById('c'+i).value.toLowerCase().trim();
if(ans===cloze[i].a.toLowerCase().trim()){
score+=4;
} else {
wrongList.push({n:i+1,ans:document.getElementById('c'+i).value,correct:cloze[i].a,hint:cloze[i].hint||''});
}
}
var now = new Date();
var dateStr = now.getFullYear()+'-'+(now.getMonth()+1)+'-'+now.getDate()+' '+now.getHours()+':'+now.getMinutes();
var ansStr = '';
for(var i=0;i<cloze.length;i++){ansStr += 'C'+(i+1)+':'+document.getElementById('c'+i).value+',';}
var formUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSdFpVVqYzHXucoNf6URb4ZnSy4c7nZYk5FvKI6CNsSjPhWUjA/formResponse';
var form = document.createElement('form');
form.action = formUrl;
form.method = 'POST';
form.target = '_blank';
var f1 = document.createElement('input'); f1.name = 'entry.705164145'; f1.value = dateStr; form.appendChild(f1);
var f2 = document.createElement('input'); f2.name = 'entry.9424799'; f2.value = ansStr; form.appendChild(f2);
var f3 = document.createElement('input'); f3.name = 'entry.1864991047'; f3.value = score+'/'+(cloze.length*4); form.appendChild(f3);
document.body.appendChild(form);
form.submit();
document.body.removeChild(form);
saveHistory({type:'cloze',date:now.toLocaleDateString(),time:now.toLocaleTimeString().slice(0,5),score:score,total:cloze.length*4,wrongList:wrongList});
alert('Score: '+score+'/'+(cloze.length*4));
show('history');
}

function submitTrans(){
var score=0;
var wrongList = [];
for(var i=0;i<trans.length;i++){
var ans=document.getElementById('t'+i).value.toLowerCase().trim();
if(ans===trans[i].a.toLowerCase().trim()){
score+=4;
} else {
wrongList.push({n:i+1,ans:document.getElementById('t'+i).value,correct:trans[i].a,hint:''});
}
}
var now = new Date();
var dateStr = now.getFullYear()+'-'+(now.getMonth()+1)+'-'+now.getDate()+' '+now.getHours()+':'+now.getMinutes();
var ansStr = '';
for(var i=0;i<trans.length;i++){ansStr += 'T'+(i+1)+':'+document.getElementById('t'+i).value+',';}
var formUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSdFpVVqYzHXucoNf6URb4ZnSy4c7nZYk5FvKI6CNsSjPhWUjA/formResponse';
var form = document.createElement('form');
form.action = formUrl;
form.method = 'POST';
form.target = '_blank';
var f1 = document.createElement('input'); f1.name = 'entry.705164145'; f1.value = dateStr; form.appendChild(f1);
var f2 = document.createElement('input'); f2.name = 'entry.9424799'; f2.value = ansStr; form.appendChild(f2);
var f3 = document.createElement('input'); f3.name = 'entry.1864991047'; f3.value = score+'/'+(trans.length*4); form.appendChild(f3);
document.body.appendChild(form);
form.submit();
document.body.removeChild(form);
saveHistory({type:'trans',date:now.toLocaleDateString(),time:now.toLocaleTimeString().slice(0,5),score:score,total:trans.length*4,wrongList:wrongList});
alert('Score: '+score+'/'+(trans.length*4));
show('history');
}

show('quiz');
const historyData = [];
</script>
</body>
</html>
