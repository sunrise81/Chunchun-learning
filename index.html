<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>English Practice</title>
<style>
body{font-family:-apple-system,sans-serif;max-width:600px;margin:0 auto;padding:20px;background:#f5f5f5}
.header{text-align:center;margin-bottom:20px}
.tab-container{display:flex;margin-bottom:20px}
.tab{flex:1;padding:15px;text-align:center;cursor:pointer;background:#f0f0f0;border:none;font-size:14px}
.tab.active{background:#4A90E2;color:white}
.question-card{background:white;border-radius:12px;padding:16px;margin-bottom:16px}
.question-title{font-weight:bold;margin-bottom:12px}
.options{display:flex;flex-direction:column;gap:8px}
.option{padding:12px;border:2px solid #e0e0e0;border-radius:8px;cursor:pointer}
.option.selected{border-color:#4A90E2;background:#e8f4ff}
.btn{width:100%;padding:15px;border:none;border-radius:10px;font-size:16px;cursor:pointer;margin-top:10px;background:#4A90E2;color:white}
.cloze-input{width:100px;padding:8px;border:2px solid #4A90E2;border-radius:6px;margin:0 5px}
.history-item{background:white;padding:15px;border-radius:10px;margin-bottom:12px;border:2px solid #4A90E2;cursor:pointer}
.back-btn{padding:10px 20px;background:#666;color:white;border:none;border-radius:8px;cursor:pointer;margin-bottom:15px}
</style>
</head>
<body>
<h1 class="header">English Practice</h1>
<div class="tab-container">
<button class="tab active" id="tab-quiz" onclick="showTab('quiz')">Quiz</button>
<button class="tab" id="tab-cloze" onclick="showTab('cloze')">Cloze</button>
<button class="tab" id="tab-history" onclick="showTab('history')">History</button>
</div>
<div id="quiz-section">
<div id="questions"></div>
<button class="btn" onclick="submitQuiz()">Submit</button>
</div>
<div id="cloze-section" style="display:none">
<div class="question-card">
<div class="question-title">Cloze Test</div>
<p>Blank 1: <input type="text" id="c1" class="cloze-input" placeholder="word"></p>
<p>Blank 2: <input type="text" id="c2" class="cloze-input" placeholder="word"></p>
<p>Blank 3: <input type="text" id="c3" class="cloze-input" placeholder="word"></p>
</div>
<button class="btn" onclick="submitCloze()">Submit</button>
</div>
<div id="history-section" style="display:none">
<div id="history-list"></div>
</div>
<div id="detail-section" style="display:none">
<button class="back-btn" onclick="showTab('history')">Back</button>
<div id="detail-content"></div>
</div>
<script>
var questions = [
{n:1,c:'She ______ to music every morning.',o:['A. listen','B. listens','C. listened','D. listening'],a:'B'},
{n:2,c:'The book is ______ the table.',o:['A. in','B. on','C. at','D. to'],a:'B'},
{n:3,c:'I ______ a new book yesterday.',o:['A. buy','B. buys','C. bought','D. buying'],a:'C'}
];

var clozeQuestions = [
{n:1,t:'Last Sunday, Tom ______ to the park.',a:'went'},
{n:2,t:'He ______ football.',a:'played'},
{n:3,t:'They ______ sandwiches.',a:'ate'}
];

var userAnswers = {};

var historyData = [
{date:'2026-03-21 19:17', score:4, total:12, type:'quiz', answers:'Q1:A,Q2:B,Q3:C', wrong:'1'}
];

function renderQuestions() {
var html = '';
for(var i=0;i<questions.length;i++) {
var q = questions[i];
html = html + '<div class="question-card"><div class="question-title">Q' + q.n + '. ' + q.c + '</div><div class="options">';
for(var j=0;j<q.o.length;j++) {
var opt = q.o[j];
var letter = opt.charAt(0);
html = html + '<div class="option" data-n="' + q.n + '" data-a="' + letter + '" onclick="selectOption(this)">' + opt + '</div>';
}
html = html + '</div></div>';
}
document.getElementById('questions').innerHTML = html;
}

function selectOption(el) {
var n = el.getAttribute('data-n');
var a = el.getAttribute('data-a');
userAnswers[n] = a;
var parent = el.parentElement;
var opts = parent.getElementsByClassName('option');
for(var i=0;i<opts.length;i++) {opts[i].classList.remove('selected');}
el.classList.add('selected');
}

function showTab(tab) {
document.getElementById('tab-quiz').className = tab === 'quiz' ? 'tab active' : 'tab';
document.getElementById('tab-cloze').className = tab === 'cloze' ? 'tab active' : 'tab';
document.getElementById('tab-history').className = tab === 'history' ? 'tab active' : 'tab';
document.getElementById('quiz-section').style.display = tab === 'quiz' ? 'block' : 'none';
document.getElementById('cloze-section').style.display = tab === 'cloze' ? 'block' : 'none';
document.getElementById('history-section').style.display = tab === 'history' ? 'block' : 'none';
document.getElementById('detail-section').style.display = tab === 'detail' ? 'block' : 'none';
if(tab === 'history') renderHistory();
}

function submitQuiz() {
var score = 0;
for(var i=0;i<questions.length;i++) {
var q = questions[i];
if(userAnswers[q.n] === q.a) {score = score + 4;}
}
var d = new Date();
var timeStr = d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate() + ' ' + d.getHours() + ':' + d.getMinutes();
var ansStr = '';
var wrongStr = '';
for(var n in userAnswers) {
ansStr = ansStr + 'Q' + n + ':' + userAnswers[n] + ',';
if(userAnswers[n] !== questions[n-1].a) {wrongStr = wrongStr + n + ',';}
}
historyData.unshift({date:timeStr, score:score, total:12, type:'quiz', answers:ansStr, wrong:wrongStr});
alert('Score: ' + score + '/12');
renderQuestions();
}

function submitCloze() {
var score = 0;
var ansStr = '';
var wrongStr = '';
for(var i=1;i<=3;i++) {
var ans = document.getElementById('c'+i).value.toLowerCase().trim();
var correct = clozeQuestions[i-1].a;
ansStr = ansStr + 'C' + i + ':' + ans + ',';
if(ans === correct) {score = score + 4;} else {wrongStr = wrongStr + i + ',';}
}
var d = new Date();
var timeStr = d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate() + ' ' + d.getHours() + ':' + d.getMinutes();
historyData.unshift({date:timeStr, score:score, total:12, type:'cloze', answers:ansStr, wrong:wrongStr});
alert('Cloze Score: ' + score + '/12');
}

function showDetail(idx) {
var h = historyData[idx];
var html = '<div class="question-card">';
html = html + '<div class="question-title" style="font-size:20px;color:#4A90E2;">' + h.score + ' / ' + h.total + '</div>';
html = html + '<div style="color:#666;margin-bottom:15px;">' + h.date + '</div>';

if(h.type === 'quiz') {
var wrongArr = h.wrong ? h.wrong.split(',') : [];
if(wrongArr.length > 0 && wrongArr[0] !== '') {
html = html + '<div><b>Wrong Answers:</b></div>';
var arr = h.answers.split(',');
for(var i=0;i<arr.length;i++) {
if(arr[i]) {
var parts = arr[i].split(':');
if(parts.length === 2) {
var qNum = parseInt(parts[0].substring(1));
var userAns = parts[1];
var q = questions[qNum-1];
if(q && userAns !== q.a) {
html = html + '<div style="padding:8px;margin:5px 0;background:#ffeaea;border-radius:8px;">';
html = html + '<div><b>Q' + qNum + '.</b> ' + q.c + '</div>';
html = html + '<div style="margin-top:5px;">Your answer: <b>' + userAns + '</b> <span style="color:red;">Correct: ' + q.a + '</span>';
html = html + '</div></div>';
}
}
}
}
}
} else {
var wrongArr = h.wrong ? h.wrong.split(',') : [];
if(wrongArr.length > 0 && wrongArr[0] !== '') {
html = html + '<div><b>Wrong Answers:</b></div>';
var arr = h.answers.split(',');
for(var i=0;i<arr.length;i++) {
if(arr[i]) {
var parts = arr[i].split(':');
if(parts.length === 2) {
var cNum = parseInt(parts[0].substring(1));
var userAns = parts[1];
var correct = clozeQuestions[cNum-1].a;
if(userAns !== correct) {
html = html + '<div style="padding:8px;margin:5px 0;background:#ffeaea;border-radius:8px;">';
html = html + '<div><b>Blank ' + cNum + ':</b> ' + clozeQuestions[cNum-1].t + '</div>';
html = html + '<div style="margin-top:5px;">Your answer: <b>' + userAns + '</b> <span style="color:red;">Correct: ' + correct + '</span>';
html = html + '</div></div>';
}
}
}
}
}
}
html = html + '</div>';
document.getElementById('detail-content').innerHTML = html;
showTab('detail');
}

function renderHistory() {
var html = '';
for(var i=0;i<historyData.length;i++) {
var h = historyData[i];
var typeLabel = h.type === 'cloze' ? 'Cloze' : 'Quiz';
html = html + '<div class="history-item" onclick="showDetail(' + i + ')"><div><b>' + typeLabel + '</b> <span style="color:#999;font-size:12px;">' + h.date + '</span></div><div style="font-size:24px;color:#4A90E2;">' + h.score + ' / ' + h.total + '</div></div>';
}
if(historyData.length === 0) {html = '<div style="text-align:center;color:#666;padding:30px;">No records</div>';}
document.getElementById('history-list').innerHTML = html;
}

renderQuestions();
</script>
</body>
</html>
