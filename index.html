<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Cloze Practice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background: #f5f0eb;
            color: #2c2c2c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 680px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 36px;
        }
        .day-number {
            font-size: 2.4rem;
            font-weight: bold;
            color: #1a1a2e;
        }
        .date {
            font-size: 1rem;
            color: #666;
            margin-top: 4px;
        }
        .topic {
            text-align: center;
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 28px;
            font-style: italic;
        }
        .cloze-paragraph {
            font-size: 1.15rem;
            line-height: 2.4;
            background: #fff;
            padding: 28px 32px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .blank {
            display: inline-block;
            min-width: 80px;
            width: auto;
            border: none;
            border-bottom: 2px solid #888;
            padding: 2px 8px;
            margin: 0 2px;
            font-family: inherit;
            font-size: inherit;
            text-align: center;
            background: transparent;
            outline: none;
            transition: border-color 0.2s;
        }
        .blank:focus {
            border-bottom-color: #4a6fa5;
        }
        .blank.correct {
            border-bottom-color: #2e8b57;
            color: #2e8b57;
            font-weight: bold;
        }
        .blank.incorrect {
            border-bottom-color: #c0392b;
            color: #c0392b;
        }
        .controls {
            text-align: center;
            margin-top: 28px;
        }
        button {
            font-family: inherit;
            font-size: 1rem;
            padding: 10px 28px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 0 6px;
            transition: background 0.2s;
        }
        #checkBtn {
            background: #4a6fa5;
            color: #fff;
        }
        #checkBtn:hover { background: #3b5d8a; }
        #revealBtn {
            background: #ddd;
            color: #333;
        }
        #revealBtn:hover { background: #ccc; }
        .score {
            text-align: center;
            margin-top: 18px;
            font-size: 1rem;
            color: #555;
            min-height: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="day-number" id="dayNumber"></div>
            <div class="date" id="dateDisplay"></div>
        </div>
        <div class="topic" id="topic"></div>
        <div class="cloze-paragraph" id="clozeArea"></div>
        <div class="controls">
            <button id="checkBtn" onclick="checkAnswers()">Check</button>
            <button id="revealBtn" onclick="revealAnswers()">Reveal</button>
        </div>
        <div class="score" id="score"></div>
    </div>

    <script>
        function getDayData(day) {
            const data = {
                1: {
                    topic: "Few vs. Little — Countable & Uncountable Nouns",
                    paragraph: [
                        "There are only ",
                        { blank: true, answer: "a few" },
                        " eggs left in the fridge, so we can't make a big omelette. We also have very ",
                        { blank: true, answer: "little" },
                        " milk, which means cereal is out of the question. I noticed ",
                        { blank: true, answer: "a few" },
                        " apples on the counter — maybe enough for a small pie. Unfortunately, there is ",
                        { blank: true, answer: "little" },
                        " sugar in the pantry, so the pie won't be very sweet. ",
                        { blank: true, answer: "Few" },
                        " restaurants nearby are open this early, and I have ",
                        { blank: true, answer: "little" },
                        " patience to wait in line. Let's just grab the ",
                        { blank: true, answer: "few" },
                        " granola bars we have and head out — we have very ",
                        { blank: true, answer: "little" },
                        " time before the train leaves."
                    ]
                }
            };
            return data[day] || null;
        }

        const START_DATE = new Date('2026-03-23');

        function getCurrentDay() {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const start = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), START_DATE.getDate());
            const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
            return Math.max(1, diff + 1);
        }

        function formatDate(date) {
            return date.toLocaleDateString('en-US', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });
        }

        function render() {
            const day = getCurrentDay();
            const data = getDayData(day);

            document.getElementById('dayNumber').textContent = 'Day ' + day;
            document.getElementById('dateDisplay').textContent = formatDate(new Date());

            if (!data) {
                document.getElementById('topic').textContent = '';
                document.getElementById('clozeArea').innerHTML = '<em>No data for today yet. Check back tomorrow!</em>';
                document.querySelector('.controls').style.display = 'none';
                return;
            }

            document.getElementById('topic').textContent = data.topic;

            var html = '';
            var blankIndex = 0;
            for (var i = 0; i < data.paragraph.length; i++) {
                var part = data.paragraph[i];
                if (typeof part === 'string') {
                    html += part;
                } else if (part.blank) {
                    var size = Math.max(part.answer.length + 2, 8);
                    html += '<input type="text" class="blank" data-answer="' + part.answer + '" data-index="' + blankIndex + '" size="' + size + '" autocomplete="off" spellcheck="false">';
                    blankIndex++;
                }
            }
            document.getElementById('clozeArea').innerHTML = html;
        }

        function checkAnswers() {
            var blanks = document.querySelectorAll('.blank');
            var correct = 0;
            blanks.forEach(function(input) {
                var userAnswer = input.value.trim().toLowerCase();
                var expected = input.dataset.answer.toLowerCase();
                input.classList.remove('correct', 'incorrect');
                if (userAnswer === expected) {
                    input.classList.add('correct');
                    correct++;
                } else if (userAnswer !== '') {
                    input.classList.add('incorrect');
                }
            });
            document.getElementById('score').textContent = correct + ' / ' + blanks.length + ' correct';
        }

        function revealAnswers() {
            var blanks = document.querySelectorAll('.blank');
            blanks.forEach(function(input) {
                input.value = input.dataset.answer;
                input.classList.remove('incorrect');
                input.classList.add('correct');
            });
            document.getElementById('score').textContent = 'All answers revealed.';
        }

        render();
    </script>
</body>
</html>
