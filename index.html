r-color: var(--wrong); color: var(--wrong); font-weight: 700; } .opt-btn:disabled { cursor: default; }  /* Fill input */ .fill-wrap { display: flex; gap: 10px; align-items: center; } .fill-input { flex: 1; border: 2px solid var(--g5); border-radius: 10px; padding: 10px 14px; font-size: 15px; font-family: inherit; outline: none; transition: border-color 0.2s; background: var(--g8); color: #1a2e1a; } .fill-input:focus { border-color: var(--g3); background: #fff; } .fill-input.correct-input { border-color: var(--correct); background: #c8e6c9; } .fill-input.wrong-input   { border-color: var(--wrong); background: #ffcdd2; } .fill-input:disabled { cursor: default; }  /* Hint */ .hint-row { margin-top: 12px; } .hint-btn { background: none; border: 1.5px solid var(--g5); border-radius: 8px; padding: 4px 12px; font-size: 12px; color: var(--g3); cursor: pointer; font-family: inherit; transition: all 0.15s; } .hint-btn:hover { background: var(--g7); } .hint-box { display: none; margin-top: 8px; background: var(--g7); border-left: 3px solid var(--g4); border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #2e4a2e; line-height: 1.6; } .hint-box.show { display: block; } .hint-box .en { font-style: italic; color: var(--g2); }  /* Result */ .result-row { margin-top: 10px; display: none; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; } .result-row.show { display: flex; } .result-icon { font-size: 18px; } .result-text.correct-text { color: var(--correct); } .result-text.wrong-text   { color: var(--wrong); } .answer-reveal { font-size: 12px; color: var(--g2); margin-left: 4px; }  /* Buttons */ .actions { max-width: 640px; margin: 24px auto 0; display: flex; flex-direction: column; gap: 10px; } .btn-primary { width: 100%; padding: 15px; background: linear-gradient(135deg, var(--g2), var(--g4)); color: #fff; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: 0 4px 14px rgba(46,125,50,0.35); essFill"></div></div> <div class="progress-label" id="progressLabel">宸插畬鎴?0 / 8 棰?/div> </div>  <div class="questions" id="questionsContainer"></div>  <div class="actions"> <button class="btn-primary" id="submitBtn" onclick="submitAll()">鎻愪氦绛旀 鉁?/button> <button class="btn-secondary" id="resetBtn" onclick="resetAll()" style="display:none">閲嶆柊缁冧範 馃攧</button> </div>  <div class="score-panel" id="scorePanel"> <div class="score-emoji" id="scoreEmoji"></div> <div class="star-row" id="starRow"></div> <div class="score-num" id="scoreNum"></div> <div class="score-label" id="scoreLabel"></div> <div class="score-msg" id="scoreMsg"></div> </div> <p class="saved-note" id="savedNote" style="display:none">鉁?鏈鎴愮哗宸茶嚜鍔ㄤ繚瀛?/p>  <script> const STORAGE_KEY = 'eng_day1_v1';  const questions = [ { id: 'q1', type: 'choice', text: '鎴戝湪杩欎釜鍩庡競鏈塤__鏈嬪弸锛屾垜浠粡甯镐竴璧风帺銆?br><small style="color:#555">I have ___ friends in this city and we often play together.</small>', blank: '___', options: ['few', 'a few', 'little', 'a little'], answer: 'a few', hint: { zh: '"鏈嬪弸" friends 鏄彲鏁板悕璇嶏紙鑳芥暟鍑哄嚑涓級銆傚彞瀛愭槸姝ｉ潰鎰忔€濓紙鏈変竴浜涳級锛屾墍浠ョ敤 <b>a few</b>銆?, rule: 'a few + 鍙暟鍚嶈瘝 = 鏈変竴浜涳紙姝ｉ潰锛? } }, { id: 'q2', type: 'choice', text: '鍐扮閲屽彧鏈塤__鐗涘ザ锛屽鍠濅竴鏉€?br><small style="color:#555">There is ___ milk in the fridge, enough for one cup.</small>', blank: '___', options: ['few', 'a few', 'little', 'a little'], answer: 'a little', hint: { zh: '"鐗涘ザ" milk 鏄笉鍙暟鍚嶈瘝锛堜笉鑳芥暟涓暟锛夈€傚彞瀛愭槸姝ｉ潰鎰忔€濓紙杩樻湁涓€浜涳級锛屾墍浠ョ敤 <b>a little</b>銆?, rule: 'a little + 涓嶅彲鏁板悕璇?= 鏈変竴浜涳紙姝ｉ潰锛? } }, { id: 'q3', type: 'choice', text: '濂瑰嚑涔庢病鏈夐挶锛屾墍浠ヤ拱涓嶈捣閭ｆ湰涔︺€?br><small style="color:#555">She has ___ money, so she cannot buy the book.</small>', blank: '___', options: ['few', 'a few', 'little', 'a little'], answer: 'little', hint: { zh: '"閽? money 鏄笉鍙暟鍚嶈瘝銆傚彞瀛愭槸璐熼潰鎰忔€濓紙鍑犱箮娌℃湁锛夛紝鎵€浠ョ敤 <b>little</b>锛堟病鏈?a锛夈€?, rule: 'little + 涓嶅彲鏁板悕璇?= 鍑犱箮娌℃湁锛堣礋闈級' } }, { id: 'q4', type: 'choice', text: '鍥犱负涓嬮洩锛屼粖澶╁嚑涔庢病鏈夊鐢熸潵涓婂銆?br><small style="color:#555">___ students came to school today because of the heavy snow.</small>', blank: '___锛堝彞棣栵級', options: ['Few', 'A few', 'Little', 'A little'], answer: 'Few', hint: { zh: '"瀛︾敓" students 鏄彲鏁板悕璇嶏紙澶嶆暟锛夈€傚彞瀛愭槸璐熼潰鎰忔€濓紙鍑犱箮娌℃潵锛夛紝鎵€浠ョ敤 <b>Few</b>锛堝彞棣栧ぇ鍐欙紝娌℃湁 a锛夈€?, rule: 'few + 鍙暟鍚嶈瘝澶嶆暟 = 鍑犱箮娌℃湁锛堣礋闈級' } }, { id: 'q5', type: 'fill', text: '璇风粰鎴慱__姘达紝鎴戞湁鐐规复浜嗐€?br><small style="color:#555">Can I have ___ water, please? I\'m a bit thirsty.</small>', answer: 'a little', hint: { zh: '"姘? water 鏄笉鍙暟鍚嶈瘝锛屼笖鏄姹傦紙姝ｉ潰锛氭兂瑕佷竴浜涳級锛岀敤 <b>a little</b>銆?, rule: 'a little + 涓嶅彲鏁板悕璇?= 鏈変竴浜涳紙姝ｉ潰锛? } }, { id: 'q6', type: 'choice', text: '浠栧嚑涔庢病鏈夋椂闂村畬鎴愯繖浠借瘯鍗枫€?br><small style="color:#555">He has ___ time to finish the exam paper.</small>', blank: '___', options: ['few', 'a few', 'little', 'a little'], answer: 'little', hint: { zh: '"鏃堕棿" time 鏄笉鍙暟鍚嶈瘝銆傚彞瀛愭槸璐熼潰鎰忔€濓紙鏃堕棿涓嶅锛夛紝鎵€浠ョ敤 <b>little</b>銆?, rule: 'little + 涓嶅彲鏁板悕璇?= 鍑犱箮娌℃湁锛堣礋闈級' } }, { id: 'q7', type: 'fill', text: '鍋氳繖涓泲绯曢渶瑕乢__楦¤泲锛屽ぇ姒備笁鍥涗釜灏卞浜嗐€?br><small style="color:#555">I need ___ eggs to make this cake, about three or four.</small>', answer: 'a few', hint: { zh: '"楦¤泲" eggs 鏄彲鏁板悕璇嶏紙澶嶆暟锛夈€傚彞瀛愭槸姝ｉ潰鎰忔€濓紙闇€瑕佷竴浜涳級锛岀敤 <b>a few</b>銆?, rule: 'a few + 鍙暟鍚嶈瘝澶嶆暟 = 鏈変竴浜涳紙姝ｉ潰锛? } }, { id: 'q8', type: 'choice', text: '绯栧嚑涔庣敤瀹屼簡锛屾垜浠渶瑕佸幓涔版洿澶氥€?br><small style="color:#555">There is ___ sugar left. We need to buy more.</small>', blank: '___', options: ['few', 'a few', 'little', 'a little'], answer: 'little', hint: { zh: '"绯? sugar 鏄笉鍙暟鍚嶈瘝銆?闇€瑕佸幓涔版洿澶?璇存槑鍑犱箮娌℃湁浜嗭紙璐熼潰锛夛紝鐢?<b>little</b>銆?, rule: 'little + 涓嶅彲鏁板悕璇?= 鍑犱箮娌℃湁锛堣礋闈級' } } ];  let userAnswers = {}; let submitted = false;  function buildUI() { const container = document.getElementById('questionsContainer'); container.innerHTML = '';  questions.forEach((q, idx) => { const card = document.createElement('div'); card.className = 'q-card'; card.id = 'card_' + q.id;  const typeLabel = q.type === 'choice' ? '閫夋嫨棰? : '濉┖棰?; const savedAns = userAnswers[q.id] || '';  let inputHTML = ''; if (q.type === 'choice') { inputHTML = `<div class="options" id="opts_${q.id}">` + q.options.map(o => `<button class="opt-btn${savedAns === o ? ' selected' : ''}" id="opt_${q.id}_${o.replace(/\s/g,'_')}" onclick="selectOption('${q.id}','${o}')">${o}</button>` ).join('') + `</div>`; } else { inputHTML = `<div class="fill-wrap"> <input class="fill-input" id="fill_${q.id}" type="text" placeholder="鍦ㄦ杈撳叆绛旀鈥? value="${savedAns}" oninput="saveFill('${q.id}',this.value)" autocomplete="off" spellcheck="false"> </div>`; }  card.innerHTML = ` <div class="q-meta"> <div class="q-num">${idx + 1}</div> <div class="q-type">${typeLabel}</div> <div class="q-score-badge">2 鍒?/div> </div> <div class="q-text">${q.text}</div> ${inputHTML} <div class="hint-row"> <button class="hint-btn" onclick="toggleHint('hint_${q.id}',this)">馃挕 鏌ョ湅鎻愮ず</button> <div class="hint-box" id="hint_${q.id}"> ${q.hint.zh}<br> <span class="en">馃搶 瑙勫垯锛?{q.hint.rule}</span> </div> </div> <div class="result-row" id="result_${q.id}"> <span class="result-icon" id="icon_${q.id}"></span> <span class="result-text" id="rtext_${q.id}"></span> <span class="answer-reveal" id="reveal_${q.id}"></span> </div>`;  container.appendChild(card); });  updateProgress(); }  function selectOption(qid, val) { if (submitted) return; userAnswers[qid] = val; saveProgress(); // Update UI const q = questions.find(x => x.id === qid); q.options.forEach(o => { const btn = document.getElementById('opt_' + qid + '_' + o.replace(/\s/g,'_')); if (btn) btn.className = 'opt-btn' + (o === val ? ' selected' : ''); }); updateProgress(); }  function saveFill(qid, val) { userAnswers[qid] = val.trim(); saveProgress(); updateProgress(); }  function toggleHint(hintId, btn) { const box = document.getElementById(hintId); const showing = box.classList.toggle('show'); btn.textContent = showing ? '馃挕 闅愯棌鎻愮ず' : '馃挕 鏌ョ湅鎻愮ず'; }  function updateProgress() { const answered = questions.filter(q => { const a = userAnswers[q.id]; return a && a.trim() !== ''; }).length; const total = questions.length; const pct = Math.round(answered / total * 100); document.getElementById('progressFill').style.width = pct + '%'; document.getElementById('progressLabel').textContent = `宸插畬鎴?${answered} / ${total} 棰榒; }  function submitAll() { // Check unanswered const unanswered = questions.filter(q => !userAnswers[q.id] || userAnswers[q.id].trim() === ''); if (unanswered.length > 0) { alert(`杩樻湁 ${unanswered.length} 棰樻湭浣滅瓟锛岃瀹屾垚鍚庡啀鎻愪氦锛乣); return; }  submitted = true; let score = 0;  questions.forEach(q => { const ua = (userAnswers[q.id] || '').trim().toLowerCase(); const ca = q.answer.toLowerCase(); const isCorrect = ua === ca; if (isCorrect) score += 2;  const card = document.getElementById('card_' + q.id); const resultRow = document.getElementById('result_' + q.id); const icon = document.getElementById('icon_' + q.id); const rtext = document.getElementById('rtext_' + q.id); const reveal = document.getElementById('reveal_' + q.id);  card.classList.add(isCorrect ? 'correct-card' : 'wrong-card'); resultRow.classList.add('show'); icon.textContent = isCorrect ? '鉁? : '鉂?; rtext.textContent = isCorrect ? '鍥炵瓟姝ｇ‘锛? : '鍥炵瓟閿欒銆?; rtext.className = 'result-text ' + (isCorrect ? 'correct-text' : 'wrong-text'); if (!isCorrect) reveal.textContent = `姝ｇ‘绛旀锛?{q.answer}`;  // Disable inputs if (q.type === 'choice') { const opts = document.querySelectorAll(`#opts_${q.id} .opt-btn`); opts.forEach(btn => { btn.disabled = true; const bval = btn.textContent.trim().toLowerCase(); if (bval === ca) btn.classList.add('correct-opt'); else if (bval === ua && !isCorrect) btn.classList.add('wrong-opt'); else btn.className = 'opt-btn'; }); } else { const inp = document.getElementById('fill_' + q.id); inp.disabled = true; inp.classList.add(isCorrect ? 'correct-input' : 'wrong-input'); }  // Show hints automatically for wrong answers if (!isCorrect) { const hintBox = document.getElementById('hint_' + q.id); if (hintBox) hintBox.classList.add('show'); } });  showScore(score); document.getElementById('submitBtn').style.display = 'none'; document.getElementById('resetBtn').style.display = 'block';  // Save result const record = { date: new Date().toLocaleDateString('zh-CN'), score, total: questions.length * 2, answers: userAnswers }; localStorage.setItem(STORAGE_KEY, JSON.stringify(record)); document.getElementById('savedNote').style.display = 'block'; }  function showScore(score) { const total = questions.length * 2; const pct = score / total; let emoji, stars, msg;  if (pct === 1)      { emoji = '馃弳'; stars = '猸愨瓙猸愨瓙猸?; msg = '澶浜嗭紒鍏ㄩ儴绛斿锛屼綘鏄娉曞皬杈句汉锛佺户缁繚鎸侊紒'; } else if (pct >= 0.8) { emoji = '馃帀'; stars = '猸愨瓙猸愨瓙'; msg = '闈炲父濂斤紒鍙樊涓€鐐圭偣灏辨弧鍒嗕簡锛屽啀鍔犳妸鍔诧紒'; } else if (pct >= 0.6) { emoji = '馃槉'; stars = '猸愨瓙猸?; msg = '涓嶉敊鍝︼紒缁х画澶嶄範 few / a few / little / a little 鐨勫尯鍒惂锛?; } else if (pct >= 0.4) { emoji = '馃摉'; stars = '猸愨瓙'; msg = '闇€瑕佸缁冧範锛侀噸鐐硅浣忥細鍙暟鐢?few/a few锛屼笉鍙暟鐢?little/a little銆?; } else                  { emoji = '馃挭'; stars = '猸?; msg = '鍔犳补锛佸缓璁噸鏂伴槄璇荤煡璇嗙偣锛屽啀鍋氫竴娆＄粌涔狅紒'; }  document.getElementById('scoreEmoji').textContent = emoji; document.getElementById('starRow').textContent = stars; document.getElementById('scoreNum').textContent = `${score} / ${total} 鍒哷; document.getElementById('scoreLabel').textContent = `绛斿 ${score/2} 棰橈紝鍏?${questions.length} 棰榒; document.getElementById('scoreMsg').textContent = msg; document.getElementById('scorePanel').classList.add('show'); document.getElementById('scorePanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }  function resetAll() { if (!confirm('纭畾瑕侀噸鏂板紑濮嬬粌涔犲悧锛熸湰娆℃垚缁╁皢琚竻绌恒€?)) return; userAnswers = {}; submitted = false; localStorage.removeItem(STORAGE_KEY); document.getElementById('scorePanel').classList.remove('show'); document.getElementById('submitBtn').style.display = 'block'; document.getElementById('resetBtn').style.display = 'none'; document.getElementById('savedNote').style.display = 'none'; buildUI(); window.scrollTo({ top: 0, behavior: 'smooth' }); }  function saveProgress() { if (!submitted) { localStorage.setItem(STORAGE_KEY + '_draft', JSON.stringify(userAnswers)); } }  function loadProgress() { try { const done = localStorage.getItem(STORAGE_KEY); if (done) { const rec = JSON.parse(done); userAnswers = rec.answers || {}; return; } const draft = localStorage.getItem(STORAGE_KEY + '_draft'); if (draft) { userAnswers = JSON.parse(draft); } } catch(e) { userAnswers = {}; } }  // Init loadProgress(); buildUI(); </script> </body> </html>
