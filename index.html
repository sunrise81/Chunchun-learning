<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纯纯英语练习 Day 5</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
  h1 { text-align: center; color: #333; font-size: 1.6em; }
  .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 0.95em; }
  .question { background: #fff; border-radius: 10px; padding: 20px 25px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  .question p { font-size: 1.05em; color: #222; margin-bottom: 12px; }
  .options label { display: block; padding: 8px 12px; margin: 6px 0; border-radius: 6px; cursor: pointer; border: 1px solid #ddd; background: #fafafa; transition: background 0.2s; }
  .options label:hover { background: #e8f0fe; }
  .options input[type=radio] { margin-right: 8px; }
  .btn { display: block; width: 100%; padding: 13px; background: #4a90e2; color: #fff; border: none; border-radius: 8px; font-size: 1.1em; cursor: pointer; margin-top: 10px; }
  .btn:hover { background: #357abd; }
  #result { text-align: center; font-size: 1.2em; font-weight: bold; margin-top: 20px; padding: 15px; border-radius: 8px; display: none; }
  .correct { background: #d4edda; color: #155724; }
  .feedback { font-size: 0.85em; margin-top: 6px; display: none; padding: 5px 10px; border-radius: 5px; }
  .right { background: #d4edda; color: #155724; }
  .wrong { background: #f8d7da; color: #721c24; }
</style>
</head>
<body>

<h1>纯纯英语练习 Day 5</h1>
<p class="subtitle">不规则动词过去式 — 选择正确的过去式形式</p>

<div class="question" id="q1">
  <p>1. She ______ to school yesterday. (go)</p>
  <div class="options">
    <label><input type="radio" name="q1" value="a"> a) goed</label>
    <label><input type="radio" name="q1" value="b"> b) went</label>
    <label><input type="radio" name="q1" value="c"> c) gone</label>
    <label><input type="radio" name="q1" value="d"> d) goes</label>
  </div>
  <div class="feedback" id="f1"></div>
</div>

<div class="question" id="q2">
  <p>2. I ______ a great movie last night. (see)</p>
  <div class="options">
    <label><input type="radio" name="q2" value="a"> a) seed</label>
    <label><input type="radio" name="q2" value="b"> b) seen</label>
    <label><input type="radio" name="q2" value="c"> c) saw</label>
    <label><input type="radio" name="q2" value="d"> d) sew</label>
  </div>
  <div class="feedback" id="f2"></div>
</div>

<div class="question" id="q3">
  <p>3. He ______ his keys on the table. (put)</p>
  <div class="options">
    <label><input type="radio" name="q3" value="a"> a) putted</label>
    <label><input type="radio" name="q3" value="b"> b) puted</label>
    <label><input type="radio" name="q3" value="c"> c) puts</label>
    <label><input type="radio" name="q3" value="d"> d) put</label>
  </div>
  <div class="feedback" id="f3"></div>
</div>

<div class="question" id="q4">
  <p>4. We ______ lunch together at noon. (eat)</p>
  <div class="options">
    <label><input type="radio" name="q4" value="a"> a) eated</label>
    <label><input type="radio" name="q4" value="b"> b) eaten</label>
    <label><input type="radio" name="q4" value="c"> c) ate</label>
    <label><input type="radio" name="q4" value="d"> d) eats</label>
  </div>
  <div class="feedback" id="f4"></div>
</div>

<div class="question" id="q5">
  <p>5. They ______ a letter to their teacher. (write)</p>
  <div class="options">
    <label><input type="radio" name="q5" value="a"> a) writed</label>
    <label><input type="radio" name="q5" value="b"> b) wrote</label>
    <label><input type="radio" name="q5" value="c"> c) written</label>
    <label><input type="radio" name="q5" value="d"> d) writes</label>
  </div>
  <div class="feedback" id="f5"></div>
</div>

<button class="btn" onclick="checkAnswers()">提交答案</button>
<div id="result"></div>

<script>
  const answers = { q1: 'b', q2: 'c', q3: 'd', q4: 'c', q5: 'b' };
  const explanations = {
    q1: '正确答案：went（go 的过去式是 went）',
    q2: '正确答案：saw（see 的过去式是 saw）',
    q3: '正确答案：put（put 是不变形动词，过去式仍是 put）',
    q4: '正确答案：ate（eat 的过去式是 ate）',
    q5: '正确答案：wrote（write 的过去式是 wrote）'
  };

  function checkAnswers() {
    let score = 0;
    for (let q in answers) {
      const selected = document.querySelector(`input[name="${q}"]:checked`);
      const fb = document.getElementById('f' + q.slice(1));
      fb.style.display = 'block';
      if (selected && selected.value === answers[q]) {
        score++;
        fb.className = 'feedback right';
        fb.textContent = '✓ 正确！' + explanations[q];
      } else {
        fb.className = 'feedback wrong';
        fb.textContent = '✗ 错误。' + explanations[q];
      }
    }
    const result = document.getElementById('result');
    result.style.display = 'block';
    result.className = 'correct';
    result.textContent = `你的得分：${score} / 5 ${score === 5 ? '🎉 满分！太棒了！' : score >= 3 ? '👍 不错，继续加油！' : '💪 再练练，你可以的！'}`;
  }
</script>

</body>
</html>
