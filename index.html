<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绾函鑻辫缁冧範</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        .header { text-align: center; margin-bottom: 20px; }
        .tab-container { display: flex; margin-bottom: 20px; background: white; border-radius: 10px; overflow: hidden; }
        .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; background: #f0f0f0; border: none; font-size: 14px; }
        .tab.active { background: #4A90E2; color: white; }
        .question-card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .question-title { font-weight: bold; margin-bottom: 12px; }
        .options { display: flex; flex-direction: column; gap: 8px; }
        .option { padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer; }
        .option.selected { border-color: #4A90E2; background: #e8f4ff; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; margin-top: 10px; background: #4A90E2; color: white; }
    </style>
</head>
<body>
    <div class="header">
        <h1>馃 绾函鑻辫缁冧範</h1>
        <p>Day 2 | 2026骞?鏈?1鏃?/p>
    </div>
    <div class="tab-container">
        <button class="tab active" onclick="showTab('quiz')">閫夋嫨棰?/button>
        <button class="tab" onclick="showTab('cloze')">瀹屽舰濉┖</button>
    </div>
    <div id="quiz-section">
        <div id="questions"></div>
        <button class="btn" onclick="submitQuiz()">鎻愪氦绛旀</button>
    </div>
    <div id="cloze-section" style="display:none;">
        <div class="question-card">
            <div class="question-title">瀹屽舰濉┖ (9绌猴紝鍏?6鍒?</div>
            <div class="cloze-text">
                Last Sunday, Tom <input type="text" id="c1" class="cloze-input" placeholder="濉瘝"> to the park. He <input type="text" id="c2" class="cloze-input" placeholder="濉瘝"> football. They <input type="text" id="c3" class="cloze-input" placeholder="濉瘝"> sandwiches.
            </div>
        </div>
        <button class="btn" onclick="submitCloze()">鎻愪氦瀹屽舰濉┖</button>
    </div>
    <script>
        const questions = [
            {n:1,c:'She ______ to music.',o:['A.listen','B.listens','C.listened'],a:'B'},
            {n:2,c:'The book is on the ______.',o:['A.table','B.chair','C.desk'],a:'A'},
            {n:3,c:'I ______ a book yesterday.',o:['A.buy','B.buys','C.bought'],a:'C'}
        ];
        
        const clozeAnswers = {1:'went',2:'played',3:'ate'};
        
        function renderQuestions() {
            document.getElementById('questions').innerHTML = questions.map(q => 
                '<div class="question-card"><div class="question-title">Q'+q.n+'. '+q.c+'</div>' +
                '<div class="options">' + q.o.map(o => 
                    '<div class="option" onclick="select('+q.n+',\''+o[0]+'\',this)">'+o+'</div>'
                ).join('') + '</div></div>'
            ).join('');
        }
        
        const userAnswers = {};
        
        function select(n, ans, el) {
            userAnswers[n] = ans;
            document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
        }
        
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===0 ? tab==='quiz' : tab==='cloze'));
            document.getElementById('quiz-section').style.display = tab==='quiz'?'block':'none';
            document.getElementById('cloze-section').style.display = tab==='cloze'?'block':'none';
        }
        
        function submitQuiz() {
            let score = 0;
            questions.forEach(q => {
                if (userAnswers[q.n] === q.a) score += 4;
            });
            alert('寰楀垎: ' + score + '/12');
        }
        
        function submitCloze() {
            let score = 0;
            for (let i = 1; i <= 3; i++) {
                if (document.getElementById('c'+i).value.toLowerCase() === clozeAnswers[i]) score += 4;
            }
            alert('瀹屽舰濉┖寰楀垎: ' + score + '/12');
        }
        
        renderQuestions();
    </script>
</body>
</html>
