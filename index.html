<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>English Practice</title>
<style>
body{font-family:-apple-system,sans-serif;max-width:600px;margin:0 auto;padding:20px;background:#f5f5f5}
h1{text-align:center}
.btn{display:block;width:100%;padding:15px;margin:10px 0;background:#4A90E2;color:white;border:none;border-radius:10px;font-size:16px}
.card{background:white;padding:15px;margin:10px 0;border-radius:10px}
</style>
</head>
<body>
<h1>English Practice</h1>
<div id="content">
<button class="btn" onclick="showQuiz()">Quiz</button>
<button class="btn" onclick="showCloze()">Cloze</button>
<button class="btn" onclick="showTrans()">Translate</button>
<button class="btn" onclick="showHistory()">History</button>
</div>
<script>
var questions = [
{n:1,c:'She ______ to music every morning.',o:['A. listen','B. listens','C. listened','D. listening'],a:'B'},
{n:2,c:'The book is ______ the table.',o:['A. in','B. on','C. at','D. to'],a:'B'},
{n:3,c:'I ______ a new book yesterday.',o:['A. buy','B. buys','C. bought','D. buying'],a:'C'}
];

function showQuiz() {
var html = '';
for(var i=0;i<questions.length;i++) {
var q = questions[i];
html += '<div class="card"><b>Q' + q.n + '</b>: ' + q.c + '<br>';
for(var j=0;j<q.o.length;j++) {
html += q.o[j] + ' ';
}
html += '</div>';
}
html += '<button class="btn" onclick="location.reload()">Back</button>';
document.getElementById('content').innerHTML = html;
}

function showCloze() {
document.getElementById('content').innerHTML = '<div class="card"><b>Cloze Test</b><br>1. Last Sunday, Tom ______ to the park.<br>2. He ______ football.<br>3. They ______ sandwiches.</div><button class="btn" onclick="location.reload()">Back</button>';
}

function showTrans() {
document.getElementById('content').innerHTML = '<div class="card"><b>Translate</b><br>1. I bought a new schoolbag yesterday.<br>2. She is taller than me.<br>3. This book is interesting.</div><button class="btn" onclick="location.reload()">Back</button>';
}

function showHistory() {
document.getElementById('content').innerHTML = '<div class="card"><b>History</b><br>No records yet</div><button class="btn" onclick="location.reload()">Back</button>';
}
</script>
</body>
</html>
