<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小升初英语练习 - Day 2: few/a few/little/a little</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .question-card {
            position: relative;
        }

        .question-number {
            position: absolute;
            top: -15px;
            left: 20px;
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            color: white;
            padding: 5px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .question-type {
            display: inline-block;
            background: #e8f5e9;
            color: #1b5e20;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            margin-left: 10px;
        }

        .fill-blank .question-type {
            background: #fff3e0;
            color: #e65100;
        }

        .question-text {
            font-size: 1.4em;
            color: #333;
            margin: 20px 0;
            line-height: 1.6;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #2e7d32;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1em;
        }

        .option:hover {
            border-color: #2e7d32;
            background: #f1f8e9;
        }

        .option.selected {
            border-color: #2e7d32;
            background: #e8f5e9;
        }

        .option.correct {
            border-color: #4caf50;
            background: #e8f5e9;
        }

        .option.wrong {
            border-color: #f44336;
            background: #ffebee;
        }

        .option-marker {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-weight: bold;
            color: #666;
            flex-shrink: 0;
        }

        .option.selected .option-marker {
            background: #2e7d32;
            color: white;
        }

        .option.correct .option-marker {
            background: #4caf50;
            color: white;
        }

        .option.wrong .option-marker {
            background: #f44336;
            color: white;
        }

        .fill-blank-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.2em;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            margin: 15px 0;
            transition: all 0.3s ease;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        .fill-blank-input:focus {
            outline: none;
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
        }

        .fill-blank-input.correct {
            border-color: #4caf50;
            background: #e8f5e9;
        }

        .fill-blank-input.wrong {
            border-color: #f44336;
            background: #ffebee;
        }

        .hint-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fff8e1;
            border: 1px solid #ffc107;
            color: #f57c00;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s ease;
            margin-top: 10px;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        .hint-btn:hover {
            background: #fff3cd;
        }

        .hint-content {
            display: none;
            background: #fff8e1;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin-top: 12px;
            color: #e65100;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .hint-content.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(27, 94, 32, 0.4);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-card {
            display: none;
        }

        .result-card.show {
            display: block;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .score-display {
            text-align: center;
            padding: 30px;
        }

        .score-number {
            font-size: 4em;
            font-weight: bold;
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score-label {
            font-size: 1.3em;
            color: #666;
            margin-top: 10px;
        }

        .score-message {
            font-size: 1.1em;
            margin-top: 15px;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
        }

        .score-message.excellent {
            background: #e8f5e9;
            color: #1b5e20;
        }

        .score-message.good {
            background: #fff9c4;
            color: #f57f17;
        }

        .score-message.keep-trying {
            background: #ffebee;
            color: #c62828;
        }

        .knowledge-card {
            background: #e8f5e9;
            border: 1px solid #a5d6a7;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .knowledge-card h3 {
            color: #1b5e20;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .knowledge-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95em;
        }

        .knowledge-table th {
            background: #2e7d32;
            color: white;
            padding: 10px 15px;
            text-align: center;
        }

        .knowledge-table td {
            padding: 10px 15px;
            border: 1px solid #c8e6c9;
            text-align: center;
        }

        .knowledge-table tr:nth-child(even) td {
            background: #f1f8e9;
        }

        .knowledge-table .key-word {
            font-weight: bold;
            color: #1b5e20;
        }

        .history-card {
            margin-top: 30px;
        }

        .history-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .history-date {
            color: #666;
            font-size: 0.9em;
        }

        .history-score {
            font-weight: bold;
            color: #2e7d32;
        }

        .clear-history {
            background: #ff5252;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            margin-top: 15px;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        .progress-bar {
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2e7d32, #66bb6a);
            transition: width 0.3s ease;
        }

        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            color: #666;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 5px;
        }

        .legend-color.correct { background: #4caf50; }
        .legend-color.wrong   { background: #f44336; }
        .legend-color.hint    { background: #ffc107; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>&#x1F4DA; 小升初英语练习</h1>
            <p>Day 2：few / a few / little / a little（巩固练习）</p>
        </div>

        <!-- 知识点速记 -->
        <div class="card">
            <div class="knowledge-card">
                <h3>&#x1F4D6; 知识点速记</h3>
                <table class="knowledge-table">
                    <tr>
                        <th>词语</th>
                        <th>修饰名词类型</th>
                        <th>含义</th>
                        <th>记忆口诀</th>
                    </tr>
                    <tr>
                        <td class="key-word">few</td>
                        <td>可数名词（复数）</td>
                        <td>几乎没有（否定）</td>
                        <td>few = 很少，令人担心</td>
                    </tr>
                    <tr>
                        <td class="key-word">a few</td>
                        <td>可数名词（复数）</td>
                        <td>有一些（肯定）</td>
                        <td>a few = 有几个，还不错</td>
                    </tr>
                    <tr>
                        <td class="key-word">little</td>
                        <td>不可数名词</td>
                        <td>几乎没有（否定）</td>
                        <td>little = 太少了，不够用</td>
                    </tr>
                    <tr>
                        <td class="key-word">a little</td>
                        <td>不可数名词</td>
                        <td>有一点（肯定）</td>
                        <td>a little = 有一点，够用了</td>
                    </tr>
                </table>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color correct"></div>
                    <span>回答正确</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color wrong"></div>
                    <span>回答错误</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color hint"></div>
                    <span>点击查看提示</span>
                </div>
            </div>
        </div>

        <div id="questionsContainer"></div>

        <button class="submit-btn" id="submitBtn" onclick="submitAnswers()">提交答案</button>

        <div class="card result-card" id="resultCard">
            <div class="score-display">
                <div class="score-number" id="scoreNumber">0/8</div>
                <div class="score-label">你的得分</div>
                <div class="score-message" id="scoreMessage"></div>
            </div>
        </div>

        <div class="card history-card">
            <div class="history-title">&#x1F4CB; 练习历史记录</div>
            <div class="history-list" id="historyList"></div>
            <button class="clear-history" onclick="clearHistory()">清除历史记录</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'englishPracticeDay2History_v1';

        const questions = [
            {
                type: "choice",
                question: "Tom only has _____ money in his pocket. He can't buy that toy.",
                options: ["few", "a few", "little", "a little"],
                correct: "little",
                hint: "money（钱）是不可数名词，用 little 或 a little。句子说「他买不起那个玩具」，说明钱很少，表示否定（几乎没有），用 little。"
            },
            {
                type: "choice",
                question: "There are _____ chairs in the room. Everyone can sit down.",
                options: ["few", "a few", "little", "a little"],
                correct: "a few",
                hint: "chairs（椅子）是可数名词复数，用 few 或 a few。句子说「每个人都能坐下」，说明椅子足够，表示肯定（有一些），用 a few。"
            },
            {
                type: "choice",
                question: "She has _____ friends here. She feels very lonely.",
                options: ["few", "a few", "little", "a little"],
                correct: "few",
                hint: "friends（朋友）是可数名词复数，用 few 或 a few。句子说她「感到很孤独」，说明朋友极少，表示否定（几乎没有），用 few。"
            },
            {
                type: "choice",
                question: "Can I have _____ sugar in my tea? Just a tiny bit.",
                options: ["few", "a few", "little", "a little"],
                correct: "a little",
                hint: "sugar（糖）是不可数名词，用 little 或 a little。说话人想要「一点点」糖，表示肯定（需要一点），用 a little。"
            },
            {
                type: "choice",
                question: "_____ children know how to cook. They always need help in the kitchen.",
                options: ["Few", "A few", "Little", "A little"],
                correct: "Few",
                hint: "children（孩子）是可数名词复数，用 few 或 a few。句子说他们「总是需要帮助」，说明会做饭的孩子极少，表示否定（几乎没有），用 Few（句首大写）。"
            },
            {
                type: "fill",
                question: "I can speak _____ Japanese. I learned it for two months. （一点，不可数）",
                correct: "a little",
                hint: "Japanese（日语）是语言，属于不可数名词。括号提示「一点」且表示肯定（会说一点），填 a little。"
            },
            {
                type: "fill",
                question: "There are _____ eggs left in the fridge. We should go shopping. （几乎没有，可数）",
                correct: "few",
                hint: "eggs（鸡蛋）是可数名词复数。括号提示「几乎没有」且需要去购物，表示否定，填 few。"
            },
            {
                type: "fill",
                question: "I have read _____ books about science this year. They are very interesting. （几本，可数，肯定）",
                correct: "a few",
                hint: "books（书）是可数名词复数。括号提示「几本」且表示肯定（有几本，很有趣），填 a few。"
            }
        ];

        let userAnswers = {};
        let submitted = false;

        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'card question-card' + (q.type === 'fill' ? ' fill-blank' : '');

                let html = `
                    <div class="question-number">第 ${index + 1} 题</div>
                    <span class="question-type">${q.type === 'choice' ? '选择题' : '填空题'}</span>
                    <div class="question-text">${q.question}</div>
                `;

                if (q.type === 'choice') {
                    html += `<div class="options" id="options-${index}">`;
                    q.options.forEach((option, optIndex) => {
                        const letter = String.fromCharCode(65 + optIndex);
                        html += `
                            <div class="option" onclick="selectOption(${index}, '${option}', this)">
                                <div class="option-marker">${letter}</div>
                                <span>${option}</span>
                            </div>
                        `;
                    });
                    html += `</div>`;
                } else {
                    html += `
                        <input type="text" class="fill-blank-input" id="fill-${index}"
                               placeholder="请填写答案（few / a few / little / a little）..."
                               oninput="saveFillAnswer(${index}, this.value)">
                    `;
                }

                html += `
                    <button class="hint-btn" id="hintBtn-${index}" onclick="toggleHint(${index})">
                        &#x1F4A1; 查看提示
                    </button>
                    <div class="hint-content" id="hint-${index}">
                        ${q.hint}
                    </div>
                `;

                card.innerHTML = html;
                container.appendChild(card);
            });

            loadHistoryDisplay();
        }

        function selectOption(qIndex, option, element) {
            if (submitted) return;
            const options = document.querySelectorAll(`#options-${qIndex} .option`);
            options.forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');
            userAnswers[qIndex] = option;
        }

        function saveFillAnswer(qIndex, value) {
            if (submitted) return;
            userAnswers[qIndex] = value.trim().toLowerCase();
        }

        function toggleHint(index) {
            const hint = document.getElementById(`hint-${index}`);
            hint.classList.toggle('show');
        }

        function submitAnswers() {
            if (submitted) return;

            let correctCount = 0;

            questions.forEach((q, index) => {
                const userAnswer = (userAnswers[index] || '').toLowerCase();
                const correctLower = q.correct.toLowerCase();
                const isCorrect = userAnswer === correctLower;

                if (isCorrect) correctCount++;

                if (q.type === 'choice') {
                    const options = document.querySelectorAll(`#options-${index} .option`);
                    options.forEach(opt => {
                        const optText = opt.querySelector('span').textContent;
                        if (optText.toLowerCase() === correctLower) {
                            opt.classList.add('correct');
                        } else if (opt.classList.contains('selected') && !isCorrect) {
                            opt.classList.add('wrong');
                        }
                        opt.style.pointerEvents = 'none';
                    });
                } else {
                    const input = document.getElementById(`fill-${index}`);
                    input.classList.add(isCorrect ? 'correct' : 'wrong');
                    input.disabled = true;
                    if (!isCorrect) {
                        const displayVal = input.value.trim() || '（未作答）';
                        input.value = displayVal + '  ✗ 正确答案：' + q.correct;
                    }
                }

                if (!isCorrect) {
                    document.getElementById(`hint-${index}`).classList.add('show');
                }
            });

            document.querySelectorAll('.hint-btn').forEach(btn => btn.disabled = true);

            const total = questions.length;
            document.getElementById('scoreNumber').textContent = `${correctCount}/${total}`;

            const msgEl = document.getElementById('scoreMessage');
            const pct = correctCount / total;
            if (pct >= 0.875) {
                msgEl.textContent = '太棒了！你掌握得非常好！继续保持！';
                msgEl.className = 'score-message excellent';
            } else if (pct >= 0.625) {
                msgEl.textContent = '不错！再仔细看看错题的提示，你会更好！';
                msgEl.className = 'score-message good';
            } else {
                msgEl.textContent = '继续加油！多看上面的知识点表格，再试一次吧！';
                msgEl.className = 'score-message keep-trying';
            }

            document.getElementById('resultCard').classList.add('show');
            document.getElementById('submitBtn').disabled = true;

            const progress = (correctCount / total) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            saveToHistory(correctCount, total);
            submitted = true;

            document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
        }

        function saveToHistory(score, total) {
            const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const now = new Date().toLocaleString('zh-CN');
            history.unshift({ date: now, score: score, total: total });
            if (history.length > 10) history.pop();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            loadHistoryDisplay();
        }

        function loadHistoryDisplay() {
            const history = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const list = document.getElementById('historyList');

            if (history.length === 0) {
                list.innerHTML = '<p style="color:#999;text-align:center;padding:20px;">暂无练习记录</p>';
                return;
            }

            list.innerHTML = history.map(item => {
                const pct = item.score / item.total;
                const color = pct >= 0.875 ? '#2e7d32' : pct >= 0.625 ? '#f57c00' : '#c62828';
                return `
                    <div class="history-item">
                        <span class="history-date">${item.date}</span>
                        <span class="history-score" style="color:${color}">${item.score}/${item.total}</span>
                    </div>
                `;
            }).join('');
        }

        function clearHistory() {
            if (confirm('确定要清除所有历史记录吗？')) {
                localStorage.removeItem(STORAGE_KEY);
                loadHistoryDisplay();
            }
        }

        renderQuestions();
    </script>
</body>
</html>
