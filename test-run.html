<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>纯纯英语练习 - 测试</title>
</head>
<body>
    <h1>测试运行中...</h1>
    <pre id="output"></pre>
    <script>
        var output = document.getElementById('output');
        var log = function(msg) { output.textContent += msg + '\n'; console.log(msg); };
        
        log('=== 开始测试 ===');
        
        // 测试1: 检查导航按钮
        log('\n【测试1】检查导航按钮');
        var btnReview = document.getElementById('btn-review');
        log('btn-review 存在: ' + (btnReview ? '✅' : '❌'));
        
        // 测试2: 模拟历史记录数据
        log('\n【测试2】模拟历史记录');
        var mockHistory = [
            {type: 'quiz', day: 1, date: '2026-03-23', time: '10:00', wrongList: [
                {n: 1, ans: 'A', correct: 'B', hint: '解析1'},
                {n: 3, ans: 'C', correct: 'D', hint: '解析2'}
            ]},
            {type: 'cloze', day: 2, date: '2026-03-24', time: '10:00', wrongList: [
                {n: 2, ans: 'wrong', correct: 'correct', hint: '解析3'}
            ]},
            {type: 'quiz', day: 3, date: '2026-03-25', time: '10:00', wrongList: []} // 全对
        ];
        
        // 保存模拟数据
        localStorage.setItem('chunchunHistory', JSON.stringify(mockHistory));
        log('已保存模拟历史记录: ' + mockHistory.length + '条');
        
        // 测试3: 加载历史记录
        log('\n【测试3】加载历史记录');
        var stored = localStorage.getItem('chunchunHistory');
        var history = stored ? JSON.parse(stored) : [];
        log('读取到记录数: ' + history.length);
        
        // 测试4: 收集错题
        log('\n【测试4】收集错题');
        var items = [];
        for (var i = 0; i < history.length; i++) {
            var h = history[i];
            if (h.wrongList && h.wrongList.length > 0) {
                for (var j = 0; j < h.wrongList.length; j++) {
                    var w = h.wrongList[j];
                    items.push({
                        day: h.day,
                        type: h.type,
                        n: w.n,
                        ans: w.ans,
                        correct: w.correct,
                        hint: w.hint,
                        wrongTime: new Date(h.date + ' ' + h.time).getTime()
                    });
                }
            }
        }
        log('收集到错题数: ' + items.length + (items.length === 3 ? ' ✅' : ' ❌ 预期3'));
        
        // 测试5: 记忆曲线计算
        log('\n【测试5】记忆曲线计算');
        var intervals = [1, 3, 7, 14, 30];
        var testWrongTime = Date.now() - 2 * 24 * 60 * 60 * 1000; // 2天前
        var now = Date.now();
        
        for (var i = 0; i < intervals.length; i++) {
            var reviewTime = testWrongTime + intervals[i] * 24 * 60 * 60 * 1000;
            if (reviewTime > now) {
                var daysAway = Math.ceil((reviewTime - now) / (24 * 60 * 60 * 1000));
                log('2天前错的题，下次复习: ' + daysAway + '天后 ' + (daysAway === 1 ? '✅' : '❌ 预期1'));
                break;
            }
        }
        
        // 测试6: Day计算
        log('\n【测试6】Day计算');
        var firstDate = new Date(history[0].date);
        var nowDate = new Date();
        var diff = Math.floor((new Date(nowDate.getFullYear(), nowDate.getMonth(), nowDate.getDate()) - new Date(firstDate.getFullYear(), firstDate.getMonth(), firstDate.getDate())) / 86400000);
        var day = Math.max(1, diff + 1);
        log('从 ' + history[0].date + ' 到今天，Day = ' + day);
        
        // 测试7: 检查renderReview函数
        log('\n【测试7】检查renderReview函数');
        log('typeof renderReview: ' + (typeof renderReview === 'function' ? 'function ✅' : 'undefined ❌'));
        
        // 测试8: getAllWrongItems函数
        log('\n【测试8】检查getAllWrongItems函数');
        log('typeof getAllWrongItems: ' + (typeof getAllWrongItems === 'function' ? 'function ✅' : 'undefined ❌'));
        
        log('\n=== 测试完成 ===');
    </script>
</body>
</html>
